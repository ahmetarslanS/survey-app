openapi: 3.0.4
info:
  title: Survey Tool API
  description: API for managing surveys, including creation, distribution, response collection, and reporting.
  version: 0.0.0

servers:
  - url: http://api.surveytool.com/v1
    description: Production server
  - url: http://staging-api.surveytool.com/v1
    description: Staging server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token returned from the login endpoints, sent as `Authorization: Bearer <token>`."
    surveyToken:
      type: apiKey
      in: header
      name: X-Survey-Token
      description: One-time token delivered to the participant for submitting a survey response.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        sso:
          type: string

    QuestionType:
      type: string
      enum: [LIKERT, MULTIPLE_CHOICE, SINGLE_CHOICE, FREETEXT]
    SurveyStatus:
      type: string
      enum: [DRAFT, LIVE, CLOSED, OUTDATED]
      description: >
        DRAFT (Taslak), LIVE (Yayında), CLOSED (Kapandı), OUTDATED (Süresi Doldu).
        Allowed transitions - DRAFT to LIVE; LIVE to CLOSED or OUTDATED; OUTDATED to LIVE or CLOSED; CLOSED is final.

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Son katılım tarihi ileri bir tarih olmalıdır.
        path:
          type: string
          example: /admin/surveys/1
        code:
          type: string
          nullable: true
          description: >
            Machine-readable code where the client must distinguish errors, otherwise null.
            INVITATION_INVALID (404), SURVEY_EXPIRED (410), ALREADY_ANSWERED (409), RATE_LIMITED (429).
          example: SURVEY_EXPIRED

    Answer:
      type: object
      required: [answerOrder]
      properties:
        answerOrder:
          type: integer
          description: Display order of the answer within the question. For LIKERT questions it is also the scale value (e.g. 1-5).
        answerText:
          type: string
          description: Answer text. For FREETEXT questions it holds the participant's input.
        isSelected:
          type: boolean
          description: Whether this answer was selected by the participant. Ignored when defining templates/surveys.
    Question:
      type: object
      required: [questionText, questionType, questionOrder]
      properties:
        questionText:
          type: string
        questionType:
          $ref: '#/components/schemas/QuestionType'
        questionOrder:
          type: integer
          description: Display order of the question within its section.
        isMandatory:
          type: boolean
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
    QuestionDetail:
      allOf:
        - type: object
          properties:
            questionId:
              type: string
              readOnly: true
        - $ref: '#/components/schemas/Question'
    Section:
      type: object
      properties:
        sectionTitle:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    SectionDetail:
      type: object
      properties:
        sectionTitle:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionDetail'
    TemplateRequest:
      type: object
      required: [title, sections]
      properties:
        title:
          type: string
        description:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
    TemplateResponse:
      type: object
      properties:
        templateId:
          type: string
        title:
          type: string
        description:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionDetail'
        createdDate:
          type: string
          format: date-time
        updatedDate:
          type: string
          format: date-time

    CreateSurveyAnswerOption:
      type: object
      properties:
        answerOrder:
          type: integer
          description: Display order of the option. If not given, the position in the list is used (starting from 1).
        text:
          type: string
    CreateSurveyQuestion:
      type: object
      required: [questionText, type]
      description: >
        LIKERT options are fixed and generated by the backend (1 Kesinlikle Katılmıyorum ... 5 Kesinlikle Katılıyorum), `answerList` is ignored.
        SINGLE_CHOICE and MULTIPLE_CHOICE require at least 2 options in `answerList`.
        FREETEXT questions have no options.
      properties:
        questionText:
          type: string
        type:
          $ref: '#/components/schemas/QuestionType'
        questionOrder:
          type: integer
          description: Display order of the question. If not given, the position in the list is used (starting from 1).
        isOptional:
          type: boolean
          default: false
        answerList:
          type: array
          items:
            $ref: '#/components/schemas/CreateSurveyAnswerOption'
    CreateSurveyRequest:
      type: object
      description: >
        Creates a survey with LIVE status and sends an invitation mail to the participants in a single step.
        Duplicate participant mails are saved once.
      required: [title, endDate, questionList, participantMails]
      properties:
        title:
          type: string
        description:
          type: string
        endDate:
          type: string
          format: date-time
        isAnonymous:
          type: boolean
        participantMails:
          type: array
          items:
            type: string
            format: email
        questionList:
          type: array
          items:
            $ref: '#/components/schemas/CreateSurveyQuestion'
    SurveyResponse:
      type: object
      properties:
        surveyId:
          type: string
        templateId:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionDetail'
        endDate:
          type: string
          format: date-time
        isAnonymous:
          type: boolean
        isEditable:
          type: boolean
        surveyStatus:
          $ref: '#/components/schemas/SurveyStatus'
        sentParticipantsCount:
          type: integer
        createdDate:
          type: string
          format: date-time
        updatedDate:
          type: string
          format: date-time
    AdminSurveyListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/SurveyStatus'
        endDate:
          type: string
          format: date-time
        participantCount:
          type: integer
          format: int64
        responseCount:
          type: integer
          format: int64
        responseRate:
          type: number
          description: Percentage of participants who responded.
          example: 66.67
    UpdateSurveyRequest:
      type: object
      description: >
        Both fields are optional but at least one must be given; only the given fields are updated.
        If only `endDate` is given for an OUTDATED survey, the survey is reopened as LIVE.
      properties:
        status:
          $ref: '#/components/schemas/SurveyStatus'
        endDate:
          type: string
          format: date-time
          description: Must be a future date. Cannot be changed for a CLOSED survey or together with a CLOSED/OUTDATED status.
    SurveyUpdateResponse:
      type: object
      properties:
        surveyId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SurveyStatus'
        statusDescription:
          type: string
          example: Yayında
        endDate:
          type: string
          format: date-time
        updatedDateTime:
          type: string
          format: date-time

    ParticipantSurveyResponse:
      type: object
      properties:
        surveyId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        endDate:
          type: string
          format: date-time
        isAnonymous:
          type: boolean
        questions:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: integer
                format: int64
              questionText:
                type: string
              type:
                $ref: '#/components/schemas/QuestionType'
              questionOrder:
                type: integer
              isMandatory:
                type: boolean
              options:
                type: array
                description: Empty for FREETEXT. LIKERT options are the fixed 1-5 scale.
                items:
                  type: object
                  properties:
                    answerId:
                      type: integer
                      format: int64
                    answerOrder:
                      type: integer
                    text:
                      type: string
        draftAnswers:
          type: object
          nullable: true
          additionalProperties: true
          description: The draft saved with PUT /user/surveys/{surveyId}/draft, returned as is. Null if none.

    SubmitSurveyRequest:
      type: object
      required: [answers]
      description: Optional questions that were not answered can be omitted. Mandatory questions must be answered.
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId]
            properties:
              questionId:
                type: integer
                format: int64
              optionIds:
                type: array
                description: answerId values. Exactly one for LIKERT and SINGLE_CHOICE, one or more for MULTIPLE_CHOICE.
                items:
                  type: integer
                  format: int64
              text:
                type: string
                maxLength: 2000
                description: Only for FREETEXT questions.
      example:
        answers:
          - questionId: 1
            optionIds: [4]
          - questionId: 3
            optionIds: [11, 12]
          - questionId: 4
            text: Çok faydalıydı

    OptionReportResponse:
      type: object
      properties:
        answerId:
          type: integer
          format: int64
        answerOrder:
          type: integer
        text:
          type: string
        selectedCount:
          type: integer
          format: int64
        selectedRate:
          type: number
          description: >
            Percentage of the question's respondents who selected this option.
            For MULTIPLE_CHOICE questions the total of the options can be more than 100.
          example: 40.00
    QuestionReportResponse:
      type: object
      properties:
        questionId:
          type: integer
          format: int64
        questionText:
          type: string
        questionOrder:
          type: integer
        type:
          $ref: '#/components/schemas/QuestionType'
        isOptional:
          type: boolean
        answeredCount:
          type: integer
          format: int64
          description: Number of participants who answered this question.
        answeredRate:
          type: number
          description: Percentage of the survey's respondents who answered this question.
          example: 80.00
        averageScore:
          type: number
          nullable: true
          description: Average score between 1-5, only for LIKERT questions.
          example: 4.20
        options:
          type: array
          description: Options with selection counts, empty for FREETEXT questions. Options never selected are returned with 0.
          items:
            $ref: '#/components/schemas/OptionReportResponse'
        freeTextAnswers:
          type: array
          description: Given text answers, only for FREETEXT questions.
          items:
            type: string
    SurveyReportResponse:
      type: object
      properties:
        surveyId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/SurveyStatus'
        statusDescription:
          type: string
          example: Yayında
        endDate:
          type: string
          format: date-time
        isAnonymous:
          type: boolean
        participantCount:
          type: integer
          format: int64
          description: Number of invited participants.
        responseCount:
          type: integer
          format: int64
          description: Number of participants who submitted the survey.
        participationRate:
          type: number
          description: responseCount / participantCount * 100
          example: 50.00
        averageCompletionTimeSeconds:
          type: integer
          format: int64
          nullable: true
          example: 270
        averageCompletionTimeText:
          type: string
          nullable: true
          example: 4 dk 30 sn
        satisfactionAverage:
          type: number
          nullable: true
          description: Weighted average score of all LIKERT answers between 1-5.
          example: 4.20
        questionReports:
          type: array
          items:
            $ref: '#/components/schemas/QuestionReportResponse'

    QuestionAverageResponse:
      type: object
      properties:
        questionId:
          type: string
        average:
          type: number
          format: double
          example: 4.3
        responseCount:
          type: integer

paths:
  /admin/auth/login:
    post:
      tags: [Admin]
      summary: Login as admin
      description: Authenticate an admin and retrieve a token for further actions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Invalid credentials

  /admin/auth/refresh:
    post:
      tags: [Admin]
      summary: Refresh the access token
      description: Returns a new token for the owner of a valid token. Used to keep an active session alive.
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Token missing, invalid or expired

  /admin/auth/me:
    get:
      tags: [Admin]
      summary: Current admin user
      responses:
        "200":
          description: The user that owns the token
        "401":
          description: Token missing, invalid or expired

  /admin/templates:
    post:
      tags: [Admin]
      summary: Create a survey template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        "201":
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
    get:
      tags: [Admin]
      summary: List survey templates
      responses:
        "200":
          description: Templates retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateResponse'

  /admin/surveys:
    post:
      tags: [Admin]
      summary: Create and send a survey
      description: Create a new survey and send an invitation mail to the participants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
            example:
              title: Eğitim Değerlendirme Anketi
              description: Java eğitimi sonrası geri bildirim
              endDate: "2026-12-31T23:59:00"
              isAnonymous: true
              participantMails: [ornek@firma.com]
              questionList:
                - questionText: Eğitimden memnun kaldınız mı?
                  type: LIKERT
                  isOptional: false
                - questionText: En faydalı bulduğunuz konu hangisiydi?
                  type: SINGLE_CHOICE
                  answerList:
                    - text: Spring Boot
                    - text: JPA
                - questionText: İlgilendiğiniz konular
                  type: MULTIPLE_CHOICE
                  answerList:
                    - text: Mikroservis
                    - text: Güvenlik
                - questionText: Eklemek istedikleriniz
                  type: FREETEXT
                  isOptional: true
      responses:
        "200":
          description: Survey created and sent successfully, returns the id of the created survey
          content:
            application/json:
              schema:
                type: integer
                format: int64
                example: 1
        "400":
          description: Missing question type or less than 2 options for a choice question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Admin]
      summary: Get surveys
      description: Retrieve all surveys with participant and response statistics, newest first.
      responses:
        "200":
          description: Surveys retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSurveyListResponse'

  /admin/surveys/{surveyId}:
    get:
      tags: [Admin]
      summary: Get the full content of a survey
      description: Used to open a draft in the builder. Questions include sectionTitle and options; participant mails are listed.
      parameters:
        - { name: surveyId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Survey detail
        "404":
          description: Survey not found
    delete:
      tags: [Admin]
      summary: Delete a draft
      description: Only DRAFT surveys can be deleted (BR-08).
      parameters:
        - { name: surveyId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204":
          description: Deleted
        "400":
          description: Not a draft
    patch:
      tags: [Admin]
      summary: Update survey status and/or end date
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSurveyRequest'
            examples:
              extendEndDate:
                summary: Extend end date
                value:
                  endDate: "2027-01-31T23:59:00"
              closeSurvey:
                summary: Close survey
                value:
                  status: CLOSED
              reopenWithNewEndDate:
                summary: Reopen with a new end date
                value:
                  status: LIVE
                  endDate: "2027-01-31T23:59:00"
      responses:
        "200":
          description: Survey updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyUpdateResponse'
        "400":
          description: No field given, invalid status transition, past end date or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Survey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Draft flow: save as DRAFT (no tokens, no mail) -> edit -> send (LIVE + invitation mails).
  /admin/surveys/drafts:
    post:
      tags: [Admin]
      summary: Save a survey as draft
      description: Only the title is required. Questions may carry sectionTitle. No mail is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        "201":
          description: Draft created, returns the survey id
        "400":
          description: Title missing or invalid question

  /admin/surveys/{surveyId}/draft:
    put:
      tags: [Admin]
      summary: Replace the content of a draft
      description: Questions and participants are rewritten. Only for DRAFT surveys.
      parameters:
        - { name: surveyId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        "200":
          description: Draft updated, returns the survey id
        "400":
          description: Not a draft, title missing or invalid question
        "404":
          description: Survey not found

  /admin/surveys/{surveyId}/send:
    post:
      tags: [Admin]
      summary: Publish a draft and send invitations
      description: >
        Requires title, a future end date, at least one question and one participant.
        Generates invitation tokens and sends one mail per participant.
      parameters:
        - { name: surveyId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Sending summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  surveyId: { type: integer, format: int64 }
                  status: { $ref: '#/components/schemas/SurveyStatus' }
                  endDate: { type: string, format: date-time }
                  participantCount: { type: integer }
                  sentCount: { type: integer }
                  failedCount: { type: integer }
        "400":
          description: Not a draft or incomplete survey

  # Participant endpoints. Participants have no account: the invitation token from the mail link
  # ({frontend}/survey/{surveyId}?token=...) is sent in the X-Survey-Token header.
  # Rate limited per IP (app.invitation.rate-limit-per-minute) -> 429 RATE_LIMITED.
  /user/surveys/{surveyId}:
    get:
      tags: [User]
      summary: Open a survey with an invitation token
      description: First access marks the invitation as STARTED. Returns the saved draft if there is one.
      security:
        - surveyToken: []
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Survey to answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSurveyResponse'
        "404":
          description: INVITATION_INVALID - token missing, unknown, belongs to another survey or invitation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: ALREADY_ANSWERED - the token was consumed by a final submission
        "410":
          description: SURVEY_EXPIRED - end date passed or survey closed

  /user/surveys/{surveyId}/draft:
    put:
      tags: [User]
      summary: Save a draft (resume later)
      description: Any JSON object (max 64 KB). It is returned as draftAnswers on the next GET and deleted on final submission.
      security:
        - surveyToken: []
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: { "12": 4, "13": [1, 3] }
      responses:
        "204":
          description: Draft saved
        "400":
          description: Body is not a JSON object or too large
        "404":
          description: INVITATION_INVALID
        "409":
          description: ALREADY_ANSWERED
        "410":
          description: SURVEY_EXPIRED

  /user/surveys/{surveyId}/responses:
    post:
      tags: [User]
      summary: Submit a survey response
      description: >
        Final submission. The token is consumed here (not on first access), so the same link can be reopened
        until submission. In anonymous surveys the response is not linked to the participant.
      security:
        - surveyToken: []
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSurveyRequest'
      responses:
        "204":
          description: Response submitted
        "400":
          description: Mandatory question missing, unknown question/option or invalid answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: INVITATION_INVALID
        "409":
          description: ALREADY_ANSWERED
        "410":
          description: SURVEY_EXPIRED

  /admin/questions/{questionId}/average:
    get:
      tags: [Admin]
      summary: Get average answer of a question
      description: Calculate the average answer value of a LIKERT question (e.g. 4.3 on a 1-5 scale).
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Average calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionAverageResponse'
        "400":
          description: Question is not a LIKERT question
        "404":
          description: Question not found

  /admin/surveys/{surveyId}/reports:
    get:
      tags: [Admin]
      summary: Get survey report
      description: >
        Retrieve the report of a survey including participation statistics, average completion time,
        satisfaction average of LIKERT questions and per question answer statistics.
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Survey report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyReportResponse'
        "400":
          description: Invalid survey id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Survey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/surveys/{surveyId}/export/csv:
    get:
      tags: [Admin]
      summary: Export survey results as CSV
      description: Retrieve survey results in CSV format for download.
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CSV file generated successfully
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /admin/surveys/{surveyId}/export/pdf:
    get:
      tags: [Admin]
      summary: Export survey results as PDF
      description: Retrieve survey results in PDF format for download.
      parameters:
        - name: surveyId
          in: path
          required: true
