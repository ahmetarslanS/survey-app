spring.application.name=demo

# Şifreler ve gizli anahtarlar burada TUTULMAZ. Yerelde backend/application-local.properties (git dışı, şablon:
# application-local.example.properties), sunucuda ortam değişkenleri (DB_PASSWORD, MAIL_PASSWORD, JWT_SECRET,
# ADMIN_PASSWORD) kullanılır. İki yol da denenir: çalışma dizini backend/ veya repo kökü olabilir.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# Varsayılanlar yerel geliştirme içindir; Docker/sunucuda ortam değişkenleriyle ezilir (bkz. DEPLOYMENT.md).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dfx_survey_db}
spring.datasource.username=${DB_USERNAME:dfx_user}
spring.datasource.password=${DB_PASSWORD:}
# Yerelde create: her başlatmada tablolar silinir. Docker'da DDL_AUTO=update (veri korunur). Kalıcı çözüm: Flyway (T-17).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:developerschooldfx@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

########

# --- Kimlik doğrulama (JWT) ---
# Üretimde JWT_SECRET ortam değişkeni ile en az 32 karakterlik rastgele bir değer verin.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.jwt-issuer=survey-tool
# FR-02: 30 dk hareketsizlikte oturum düşer (frontend aktifken token'ı yeniler)
app.auth.token-ttl=30m
# FR-01: 5 hatalı denemede hesap 15 dk kilitlenir
app.auth.max-failed-attempts=5
app.auth.lock-duration=15m
# Sistemde hiç kullanıcı yokken açılışta oluşturulan ilk admin (serbest kayıt yok, Q-01)
app.auth.initial-admin.email=${ADMIN_EMAIL:admin@teamdefinex.com}
app.auth.initial-admin.password=${ADMIN_PASSWORD:}
app.auth.initial-admin.full-name=Survey Admin

# --- Katılımcı davetleri ---
# Davet linki: {base-url}/survey/{surveyId}?token={token}
app.invitation.base-url=${FRONTEND_URL:http://localhost:5173}
# NFR-03: /user/** uç noktalarına IP başına dakikalık istek sınırı (0 = kapalı)
app.invitation.rate-limit-per-minute=120
# NFR-42: başarısız gönderimde toplam deneme sayısı
app.mail.max-attempts=3

# --- Reverse proxy ---
# Docker'da istekler nginx üzerinden gelir. native: Tomcat X-Forwarded-For'u yalnızca iç ağdaki (Docker ağı) proxy'den
# kabul eder; böylece getRemoteAddr() gerçek istemci IP'sini verir ve /user/** rate limit'i herkesi tek IP saymaz.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# --- Sağlık kontrolü (Docker healthcheck) ---
# Yalnızca /actuator/health açık, ayrıntı göstermez. nginx /actuator'u dışarı yönlendirmez.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# SMTP erişilemese de uygulama çalışır (gönderim hataları ayrıca raporlanır); mail sorunu container'ı "unhealthy" yapmasın
management.health.mail.enabled=false
