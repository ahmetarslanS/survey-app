spring.application.name=demo

# Şifreler ve gizli anahtarlar burada TUTULMAZ. Yerelde backend/application-local.properties (git dışı, şablon:
# application-local.example.properties), sunucuda ortam değişkenleri (DB_PASSWORD, MAIL_PASSWORD, JWT_SECRET,
# ADMIN_PASSWORD) kullanılır. İki yol da denenir: çalışma dizini backend/ veya repo kökü olabilir.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/dfx_survey_db
spring.datasource.username=dfx_user
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=developerschooldfx@gmail.com
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

########

# --- Kimlik doğrulama (JWT) ---
# Üretimde JWT_SECRET ortam değişkeni ile en az 32 karakterlik rastgele bir değer verin.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.jwt-issuer=survey-tool
# FR-02: 30 dk hareketsizlikte oturum düşer (frontend aktifken token'ı yeniler)
app.auth.token-ttl=30m
# FR-01: 5 hatalı denemede hesap 15 dk kilitlenir
app.auth.max-failed-attempts=5
app.auth.lock-duration=15m
# Sistemde hiç kullanıcı yokken açılışta oluşturulan ilk admin (serbest kayıt yok, Q-01)
app.auth.initial-admin.email=${ADMIN_EMAIL:admin@teamdefinex.com}
app.auth.initial-admin.password=${ADMIN_PASSWORD:}
app.auth.initial-admin.full-name=Survey Admin

# --- Katılımcı davetleri ---
# Davet linki: {base-url}/survey/{surveyId}?token={token}
app.invitation.base-url=${FRONTEND_URL:http://localhost:5173}
# NFR-03: /user/** uç noktalarına IP başına dakikalık istek sınırı (0 = kapalı)
app.invitation.rate-limit-per-minute=120
# false: mailler gönderilmez, app.mail.outbox-dir klasörüne .html olarak yazılır (geliştirmede gerçek adreslere mail gitmesin)
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.outbox-dir=build/mail-outbox
# NFR-42: başarısız gönderimde toplam deneme sayısı
app.mail.max-attempts=3
