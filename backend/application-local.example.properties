# Yerel geliştirme sırları şablonu.
# Bu dosyayı "application-local.properties" adıyla kopyalayıp değerleri doldurun. O dosya git'e girmez (.gitignore).
# Sunucuda bu dosya yerine ortam değişkenleri kullanın: DB_PASSWORD, MAIL_PASSWORD, JWT_SECRET, ADMIN_PASSWORD.

spring.datasource.password=
# Gmail için hesap şifresi değil, "Uygulama şifresi" (App Password) kullanılır
spring.mail.password=
# En az 32 karakter, rastgele. Örn. PowerShell: [Convert]::ToBase64String((1..48 | % { Get-Random -Max 256 }))
app.auth.jwt-secret=
# Sistemde hiç kullanıcı yokken oluşturulan ilk admin hesabının şifresi (e-posta: app.auth.initial-admin.email)
app.auth.initial-admin.password=
