server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf font/woff2;

    # Backend'in sağlık uç noktası yalnızca Docker healthcheck içindir, dışarıya açılmaz
    location /api/actuator/ {
        return 404;
    }

    # Vite dev proxy'sinin karşılığı: /api/admin/surveys -> http://backend:8080/admin/surveys
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Anket gönderimi davet maillerini istek içinde gönderir (T-39); çok katılımcıda uzun sürebilir
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite çıktısı içerik hash'li dosya adları kullanır: uzun süre önbelleğe alınabilir
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: bilinmeyen yollar index.html'e düşer (React Router). index.html önbelleğe alınmaz ki yeni sürüm hemen gelsin.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
