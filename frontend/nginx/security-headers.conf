# nginx, bir location'da add_header kullanılınca üst seviyedekileri devralmaz; bu yüzden her location'da include edilir.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Katılımcı linkinde davet tokenı query string'de: başka sitelere Referer ile sızmasın
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
